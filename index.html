  <!-- Código de seguimiento adicional si es necesario -->
  <script>
    // Configuración de eventos personalizados para GTM
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    
    // Eventos de rendimiento web vitals
    window.addEventListener('load', function() {
      // Medir First Contentful Paint
      if ('performance' in window && 'getEntriesByType' in performance) {
        const fcpEntry = performance.getEntriesByType('paint').find(entry => entry.name === 'first-contentful-paint');
        if (fcpEntry) {
          gtag('event', 'web_vitals', {
            'metric_name': 'FCP',
            'metric_value': Math.round(fcpEntry.startTime)
          });
        }
      }
    });
  </script>

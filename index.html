  <!-- Web Vitals tracking -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    
    if ('PerformanceObserver' in window) {
      try {
        new PerformanceObserver((entryList) => {
          const entries = entryList.getEntries();
          const lastEntry = entries[entries.length - 1];
          gtag('event', 'web_vitals', { 'metric_name': 'LCP', 'metric_value': Math.round(lastEntry.startTime), 'metric_rating': lastEntry.startTime < 2500 ? 'good' : lastEntry.startTime < 4000 ? 'needs-improvement' : 'poor' });
        }).observe({ type: 'largest-contentful-paint', buffered: true });
      } catch (e) {}

      try {
        new PerformanceObserver((entryList) => {
          for (const entry of entryList.getEntries()) {
            if (entry.interactionId) {
              const duration = entry.duration;
              gtag('event', 'web_vitals', { 'metric_name': 'INP', 'metric_value': Math.round(duration), 'metric_rating': duration < 200 ? 'good' : duration < 500 ? 'needs-improvement' : 'poor' });
            }
          }
        }).observe({ type: 'event', durationThreshold: 16, buffered: true });
      } catch (e) {}

      try {
        let clsValue = 0;
        new PerformanceObserver((entryList) => {
          for (const entry of entryList.getEntries()) { if (!entry.hadRecentInput) { clsValue += entry.value; } }
        }).observe({ type: 'layout-shift', buffered: true });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') {
            gtag('event', 'web_vitals', { 'metric_name': 'CLS', 'metric_value': clsValue.toFixed(4), 'metric_rating': clsValue < 0.1 ? 'good' : clsValue < 0.25 ? 'needs-improvement' : 'poor' });
          }
        });
      } catch (e) {}

      try {
        new PerformanceObserver((entryList) => {
          const fcpEntry = entryList.getEntriesByName('first-contentful-paint')[0];
          if (fcpEntry) { gtag('event', 'web_vitals', { 'metric_name': 'FCP', 'metric_value': Math.round(fcpEntry.startTime), 'metric_rating': fcpEntry.startTime < 1800 ? 'good' : fcpEntry.startTime < 3000 ? 'needs-improvement' : 'poor' }); }
        }).observe({ type: 'paint', buffered: true });
      } catch (e) {}

      try {
        new PerformanceObserver((entryList) => {
          const navigationEntry = entryList.getEntries()[0];
          if (navigationEntry) {
            const ttfb = navigationEntry.responseStart - navigationEntry.requestStart;
            gtag('event', 'web_vitals', { 'metric_name': 'TTFB', 'metric_value': Math.round(ttfb), 'metric_rating': ttfb < 800 ? 'good' : ttfb < 1800 ? 'needs-improvement' : 'poor' });
          }
        }).observe({ type: 'navigation', buffered: true });
      } catch (e) {}
    }
  </script>
